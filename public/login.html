<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — LocalLoop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <style>
    body { font-family: 'Karla', sans-serif; }
  </style>
</head>
<body class="bg-dusk text-ink font-body min-h-screen flex flex-col">

  <div id="site-header" data-variant="minimal"></div>

  <main class="flex-1 flex items-center justify-center px-5 pb-16">
    <div class="w-full max-w-md bg-paper rounded-lg shadow-2xl px-6 py-8 sm:px-10 sm:py-10">
      <p class="font-stub text-xs tracking-[0.2em] uppercase text-ember text-center">Welcome back</p>
      <h1 class="font-display font-semibold text-2xl text-center mt-2">Log In</h1>

      <!-- Role toggle: same form fields, different API endpoint -->
      <div class="flex mt-6 rounded-full bg-cloth p-1 text-sm font-medium">
        <button type="button" data-role="user" class="role-tab active flex-1 py-2 rounded-full bg-ember text-white transition-colors">
          I'm a User
        </button>
        <button type="button" data-role="manager" class="role-tab flex-1 py-2 rounded-full transition-colors">
          I'm an Event Manager
        </button>
        <button type="button" data-role="admin" class="role-tab flex-1 py-2 rounded-full transition-colors">
          I'm an Admin
        </button>
      </div>

      <form id="login-form" class="mt-6 space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email</label>
          <input id="email" type="email" required class="w-full rounded-md border border-ink/20 bg-cloth px-3 py-2 focus:outline-none focus:ring-2 focus:ring-ember" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium mb-1">Password</label>
          <input id="password" type="password" required minlength="6" class="w-full rounded-md border border-ink/20 bg-cloth px-3 py-2 focus:outline-none focus:ring-2 focus:ring-ember" />
        </div>

        <p id="form-message" class="hidden text-sm text-center"></p>

        <button type="submit" class="w-full py-3 rounded-full bg-ember text-white font-medium hover:bg-ember-600 transition-colors">
          Log In
        </button>
      </form>

      <p class="text-sm text-center text-ink/70 mt-6">
        New here? <a href="/register.html" class="text-ember font-medium hover:underline">Create an account</a>
      </p>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
