<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dusk navy, matches the hero section -->
  <rect width="64" height="64" rx="14" fill="#2B2E4A"/>

  <!-- Paper flyer, slightly rotated like the hero card -->
  <g transform="rotate(-6 32 34)">
    <rect x="14" y="18" width="36" height="32" rx="3" fill="#FBF8F3"/>
    <line x1="20" y1="28" x2="44" y2="28" stroke="#2B2E4A" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="20" y1="35" x2="44" y2="35" stroke="#2B2E4A" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="20" y1="42" x2="36" y2="42" stroke="#2B2E4A" stroke-opacity="0.15" stroke-width="2"/>
  </g>

  <!-- Pushpin -->
  <circle cx="34" cy="16" r="5.5" fill="#E1592C"/>
  <circle cx="34" cy="16" r="2" fill="#FBF8F3"/>
</svg>
